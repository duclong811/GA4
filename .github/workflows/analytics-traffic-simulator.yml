name: Scheduled Real Mobile Traffic Simulator (Playwright)

on:
  schedule:
    # Chạy tự động mỗi 3 tiếng 1 lần (vào phút 0)
    - cron: '0 */3 * * *'

  # Cho phép bấm nút "Run workflow" thủ công trên GitHub UI bất kỳ lúc nào để test
  workflow_dispatch:

jobs:
  simulate-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Real Browser Traffic Simulator
        env:
          TARGET_URL: "https://www.ai-smartserve.io.vn"
        run: node simulate.mjs
