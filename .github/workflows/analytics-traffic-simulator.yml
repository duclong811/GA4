name: Scheduled GA4 Traffic Simulator (C#)

on:
  schedule:
    # Chạy tự động mỗi 3 tiếng 1 lần (vào phút 0)
    - cron: '0 */3 * * *'

  # Cho phép bấm nút "Run workflow" thủ công trên GitHub UI bất kỳ lúc nào để test
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run C# Traffic Simulator
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
        run: dotnet run
