name: Scheduled Real Mobile Traffic Simulator (Playwright)

on:
  schedule:
    # Chạy vào phút 15 của mỗi 2 tiếng (01:15, 03:15, 05:15... UTC -> tức là 07:15, 09:15, 11:15, 13:15, 15:15... giờ VN)
    # Tránh phút 00 để không bị nghẽn máy chủ GitHub
    - cron: '15 */2 * * *'

  # Cho phép bấm nút "Run workflow" thủ công trên GitHub UI bất kỳ lúc nào để test
  workflow_dispatch:

jobs:
  simulate-traffic:
    runs-on: ubuntu-latest
    # Đặt thời gian timeout tối đa cho job là 60 phút
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Real Browser Traffic Simulator
        env:
          TARGET_URL: "https://www.ai-smartserve.io.vn"
          VN_PROXY: ${{ secrets.VN_PROXY }}
        run: node simulate.mjs
